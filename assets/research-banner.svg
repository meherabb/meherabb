<style>
.beam{fill:none;stroke-width:2.5;stroke-dasharray:8 18;stroke-linecap:round;opacity:.85;animation:flow 6s linear infinite}
.nodeHalo{animation:breath 4.5s ease-in-out infinite}
.float{animation:float 7s ease-in-out infinite;transform-origin:951px 170px}
.shine{animation:shimmer 6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-260}}
@keyframes breath{0%,100%{opacity:.45;transform:scale(.86)}50%{opacity:1;transform:scale(1.25)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{0%,100%{opacity:.25}50%{opacity:.8}}
@media(prefers-reduced-motion:reduce){.beam,.nodeHalo,.float,.shine{animation:none!important}}
</style>
