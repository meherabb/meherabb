<desc id="description">Dark academic banner with luminous cyan, violet and rose neural pathways and gently flowing signals. All motion is decorative.</desc>
<defs>
<linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#070F20"/><stop offset=".54" stop-color="#0A1C32"/><stop offset="1" stop-color="#112347"/></linearGradient>
