<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="306" viewBox="0 0 1200 306" role="img" aria-labelledby="title desc">
<title id="title">Research landscape: adaptation, reliability, fairness and access</title>
<desc id="desc">Four research themes connect efficient vision adaptation, reliable perception, representation fairness, and equitable access to machine learning.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1930"/><stop offset="1" stop-color="#102236"/></linearGradient></defs>
<rect width="1200" height="306" rx="18" fill="url(#bg)"/>
<text x="39" y="43" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2.3" fill="#8bd5dc">RESEARCH LANDSCAPE</text>
<text x="39" y="71" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#b4c7db">Four connected questions. One emphasis: useful and accountable machine learning.</text>
<g font-family="Arial,Helvetica,sans-serif">
 <g><rect x="36" y="101" width="267" height="171" rx="12" fill="#152b41" stroke="#3a6581"/><rect x="36" y="101" width="267" height="5" rx="2.5" fill="#66d4cb"/>
