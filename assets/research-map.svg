<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Research landscape: vision adaptation, reliable perception, medical representation fairness and multilingual NLP</title>
<desc id="desc">Four vivid panels with restrained animated signal lines describe the research themes of Md Muntaqim Meherab.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#081626"/><stop offset="1" stop-color="#142746"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#8BA4C7" opacity=".16"/></pattern></defs>
<style>
.signal{stroke-dasharray:8 20;animation:dash 7s linear infinite}
.shimmer{animation:pulse 3.5s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-280}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.signal,.shimmer{animation:none!important}}
</style>
<rect width="1200" height="320" rx="18" fill="url(#bg)"/><rect width="1200" height="320" rx="18" fill="url(#grid)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="37" y="44" fill="#A9E7EF" font-size="16" font-weight="700" letter-spacing="2.4">RESEARCH LANDSCAPE</text><text x="37" y="73" fill="#AFC3DE" font-size="15">Methods, measurement, and meaningful evaluation.</text></g>
