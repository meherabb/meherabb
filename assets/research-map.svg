  <text x="55" y="159" fill="#fff" font-size="21" font-weight="700">Efficient Vision</text><text x="55" y="181" fill="#fff" font-size="21" font-weight="700">Adaptation</text>
  <text x="55" y="213" fill="#c9d5e4" font-size="14">Frozen ViTs · zero-gradient search</text>
  <text x="55" y="249" fill="#9ac2d8" font-size="13">IEEE/CVF WACV 2027</text></g>
 <g><rect x="324" y="101" width="267" height="171" rx="12" fill="#152b41" stroke="#3a6581"/><rect x="324" y="101" width="267" height="5" rx="2.5" fill="#88aaff"/>
  <text x="343" y="132" fill="#93b7ff" font-size="12" font-weight="700" letter-spacing="1.5">02 / RELIABILITY</text>
  <text x="343" y="159" fill="#fff" font-size="21" font-weight="700">Reliable</text><text x="343" y="181" fill="#fff" font-size="21" font-weight="700">Perception</text>
  <text x="343" y="213" fill="#c9d5e4" font-size="14">Occlusion · confidence calibration</text>
  <text x="343" y="249" fill="#9ac2d8" font-size="13">NeurIPS TCCML 2026</text></g>
 <g><rect x="612" y="101" width="267" height="171" rx="12" fill="#152b41" stroke="#3a6581"/><rect x="612" y="101" width="267" height="5" rx="2.5" fill="#c5acff"/>
  <text x="631" y="132" fill="#d0b6ff" font-size="12" font-weight="700" letter-spacing="1.5">03 / FAIRNESS</text>
  <text x="631" y="159" fill="#fff" font-size="21" font-weight="700">Responsible</text><text x="631" y="181" fill="#fff" font-size="21" font-weight="700">Representations</text>
